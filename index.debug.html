<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Velmora Fine Jewelry</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('root').innerHTML = `
          <div style="padding: 50px; color: red;">
            <h1>JavaScript Error</h1>
            <p><strong>Error:</strong> ${msg}</p>
            <p><strong>URL:</strong> ${url}</p>
            <p><strong>Line:</strong> ${lineNo}</p>
            <p><strong>Column:</strong> ${columnNo}</p>
            <pre>${error?.stack || 'No stack trace'}</pre>
          </div>
        `;
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
