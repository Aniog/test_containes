<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Test</title>
  <style>
    body {
      font-family: system-ui;
      padding: 50px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple HTML Test</h1>
    <p>If you can see this, the server is working!</p>
    <button onclick="testJS()">Test JavaScript</button>
    <p id="result"></p>
  </div>
  
  <script>
    function testJS() {
      document.getElementById('result').textContent = 'JavaScript is working! Time: ' + new Date().toLocaleTimeString();
    }
    console.log('Simple test page loaded');
  </script>
</body>
</html>
