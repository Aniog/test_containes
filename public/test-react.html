<!DOCTYPE html>
<html>
<head>
  <title>React CDN Test</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    console.log('CDN React test: Starting...');
    
    function App() {
      console.log('CDN React test: App component rendering...');
      return (
        <div style={{ padding: '50px', fontFamily: 'system-ui' }}>
          <h1 style={{ fontSize: '48px', color: '#1a1a1a' }}>VELMORA</h1>
          <p style={{ fontSize: '20px', color: '#666' }}>React with CDN works!</p>
          <p>Time: {new Date().toLocaleTimeString()}</p>
        </div>
      );
    }
    
    console.log('CDN React test: Rendering...');
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    console.log('CDN React test: Rendered!');
  </script>
</body>
</html>
