<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>China Sourcing Agent | Supplier Verification, QC & Shipping | SSourcing China</title>
    <meta name="description" content="SSourcing China is a China-based sourcing agent helping overseas buyers find suppliers, verify factories, inspect quality, follow production, and coordinate shipping." />
    <style>
      .bg-brand-navy { background-color: #0f2a43; }
      .bg-brand-blue { background-color: #2f6f9f; }
      .bg-brand-amber { background-color: #d9902f; }
      .bg-brand-amberDark { background-color: #c57c1f; }
      .bg-brand-cream { background-color: #f7f4ef; }
      .bg-brand-mist { background-color: #edf2f6; }
      .bg-brand-navy\/92 { background-color: rgb(15 42 67 / 0.92); }
      .bg-brand-mist\/50 { background-color: rgb(237 242 246 / 0.5); }
      .text-brand-navy { color: #0f2a43; }
      .text-brand-blue { color: #2f6f9f; }
      .text-brand-amber { color: #d9902f; }
      .text-brand-ink { color: #13202b; }
      .text-brand-muted { color: #5d6b78; }
      .border-brand-blue { border-color: #2f6f9f; }
      .shadow-card { box-shadow: 0 18px 45px rgb(15 42 67 / 0.10); }
      .hover\:bg-brand-amberDark:hover { background-color: #c57c1f; }
      .hover\:bg-brand-mist:hover { background-color: #edf2f6; }
      .hover\:text-brand-navy:hover { color: #0f2a43; }
      .focus\:border-brand-blue:focus { border-color: #2f6f9f; }
      .focus\:ring-brand-blue\/15:focus { --tw-ring-color: rgb(47 111 159 / 0.15); }
      .focus\:ring-brand-amber\/30:focus { --tw-ring-color: rgb(217 144 47 / 0.30); }
      .open\:bg-brand-mist\/50[open] { background-color: rgb(237 242 246 / 0.5); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        if (window.__STRK_PREVIEW_ROUTE_BRIDGE__) {
          return;
        }

        window.__STRK_PREVIEW_ROUTE_BRIDGE__ = true;

        const CHANNEL = "strikingly-preview";
        const VERSION = 1;

        const getRoutePayload = (source) => ({
          url: window.location.href,
          origin: window.location.origin,
          path: `${window.location.pathname}${window.location.search}${window.location.hash}`,
          pathname: window.location.pathname,
          search: window.location.search,
          hash: window.location.hash,
          title: document.title,
          source,
          timestamp: Date.now(),
        });

        const postRoute = (type, source) => {
          if (!window.parent || window.parent === window) {
            return;
          }

          try {
            window.parent.postMessage(
              {
                channel: CHANNEL,
                version: VERSION,
                type,
                payload: getRoutePayload(source),
              },
              "*",
            );
          } catch {
            // Keep the generated app running even if preview communication fails.
          }
        };

        const notifyRouteChanged = (source) => {
          window.requestAnimationFrame(() =>
            postRoute("route:changed", source),
          );
        };

        const patchHistoryMethod = (methodName) => {
          const originalMethod = window.history[methodName];
          if (typeof originalMethod !== "function") {
            return;
          }

          window.history[methodName] = function patchedHistoryMethod(...args) {
            const result = originalMethod.apply(this, args);
            notifyRouteChanged(methodName);
            return result;
          };
        };

        patchHistoryMethod("pushState");
        patchHistoryMethod("replaceState");

        window.addEventListener("popstate", () => {
          notifyRouteChanged("popstate");
        });

        window.addEventListener("hashchange", () => {
          notifyRouteChanged("hashchange");
        });

        window.addEventListener("load", () => {
          postRoute("route:ready", "load");
          postRoute("route:changed", "load");
        });

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (
            !data ||
            typeof data !== "object" ||
            data.channel !== CHANNEL ||
            data.version !== VERSION
          ) {
            return;
          }

          if (data.type === "route:request") {
            postRoute("route:changed", "load");
            return;
          }

          if (data.type !== "route:navigate") {
            return;
          }

          const path = data.payload?.path;
          if (typeof path !== "string" || !path) {
            return;
          }

          const replace = Boolean(data.payload?.replace);
          const navigate = window.__STRIKINGLY_PREVIEW_NAVIGATE__;

          if (typeof navigate === "function") {
            navigate(path, { replace });
            notifyRouteChanged("navigate-command");
            return;
          }

          if (replace) {
            window.history.replaceState({}, "", path);
          } else {
            window.history.pushState({}, "", path);
          }

          window.dispatchEvent(new PopStateEvent("popstate", { state: {} }));
          notifyRouteChanged("navigate-command");
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
