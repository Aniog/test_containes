<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Velmora Fine Jewelry</title>
    <script>
      // Capture and display any JavaScript errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 40px; font-family: system-ui;">
              <h1 style="color: #d32f2f; font-size: 28px; margin-bottom: 16px;">
                JavaScript Error Detected
              </h1>
              <div style="background: #fff3f3; padding: 20px; border-radius: 8px; border: 1px solid #ffcdd2;">
                <p style="margin: 8px 0;"><strong>Error:</strong> ${msg}</p>
                <p style="margin: 8px 0;"><strong>File:</strong> ${url || 'Unknown'}</p>
                <p style="margin: 8px 0;"><strong>Line:</strong> ${lineNo || 'Unknown'}</p>
                <details style="margin-top: 16px;">
                  <summary style="cursor: pointer; font-weight: 600;">Stack Trace</summary>
                  <pre style="background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; margin-top: 8px;">${error?.stack || 'No stack trace available'}</pre>
                </details>
              </div>
              <div style="margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px;">
                <p style="margin: 0; font-size: 14px;"><strong>Debug Info:</strong> Check browser console for more details.</p>
              </div>
            </div>
          `;
        }
        return false;
      };
      
      // Log when scripts start loading
      console.log('index.html: Script loading started...');
    </script>
  </head>
  <body>
    <div id="root">
      <div style="padding: 50px; text-align: center; font-family: system-ui;">
        <h1 style="font-size: 24px; color: #666;">Loading Velmora Fine Jewelry...</h1>
        <p style="color: #999;">Please wait while we prepare your experience...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
